  const mascararEmail = (e) => {
    if (!e) return null;
    const [u, d] = e.split('@');
    return `${u.slice(0, 2)}${'*'.repeat(Math.max(1, u.length - 2))}@${d}`;
  };
  const mascararTelefone = (t) => {
    const d = soDigitos(t);
    return d.length < 4 ? null : `(${d.slice(2, 4)}) *****-${d.slice(-4)}`;
  };

  const erro = (status, corpo) => Object.assign(new Error(corpo.erro), { status, corpo });

  // O boleto único fica AO LADO das parcelas, que mantêm o boleto delas. Pago o
  // único, as parcelas dele são quitadas; vencido sem pagamento, só ele é cancelado.
  const unicosPorId = new Map();
  const unicoExpirou = (u) => Boolean(u) && u.status !== 'pago' && u.vencimento < HOJE;
  const unicoAtivoDa = (b) => {
    const u = b.noUnico && unicosPorId.get(b.noUnico);
    return u && u.status !== 'pago' && !unicoExpirou(u) ? u : null;
  };

  function situacaoBoleto(b) {
    if (b.unico) return b.status === 'pago' ? 'pago' : unicoExpirou(b) ? 'expirado' : 'em_aberto';
    // 2ª via com data nova tira a parcela do atraso até o novo vencimento.
    if (b.status === 'em_atraso' && b.vencimento >= HOJE) return 'em_aberto';
    return b.status;
  }

  const nomeCobranca = (b) => (b.unico ? 'Boleto único' : `Parcela ${b.parcela}`);

  function projetarBoleto(b) {
    const status = situacaoBoleto(b);
    const emitido = status === 'em_aberto' || status === 'em_atraso';
    return {
      id: b.id, parcela: b.parcela, nome: nomeCobranca(b), descricao: b.descricao, vencimento: b.vencimento,
      valor: b.valor, status, pagoEm: b.pagoEm, valorPago: b.valorPago,
      valorAtualizado: b.valorAtualizado || null,
      encargos: b.encargos || null,
      temLinhaDigitavel: emitido,
      unicoAtivo: (() => { const u = !b.unico && unicoAtivoDa(b); return u ? { id: u.id, vencimento: u.vencimento } : null; })(),
      unico: b.unico || null,
    };
  }

  // O que se deve HOJE: vencida vale a parcela mais o juro corrido até hoje.
  const comprovantePendente = (adesaoId, billId) =>
    comprovantes.some((c) => c.adesaoId === adesaoId && c.billId === billId && c.status === 'em_analise');

  // vencida com comprovante anexado aparece como "em análise", não como atraso
  // A taxa administrativa de gestão de conta vem do contrato (o plano da turma
  // define o valor) e é somada em CADA boleto — inclusive no boleto único, uma
  // vez só. Contrato sem taxa: nada é somado.
  function taxaDoContrato(adesao) {
    return Number(adesao?.contrato?.taxaBoleto) || 0;
  }

  async function projetarComValor(b, adesaoId, adesao) {
    const p = projetarBoleto(b);
    p.taxaBoleto = b.status === 'pago' ? 0 : taxaDoContrato(adesao);
    if (p.status === 'pago') p.valorDevido = b.valorPago || b.valor;
    else if (p.status === 'em_atraso' && !b.unico) {
      p.encargosHoje = calcularEncargos(b, new Date(`${HOJE}T12:00:00`));
      p.valorDevido = p.encargosHoje.total;
    } else p.valorDevido = b.valorAtualizado || b.valor;
    if (p.status === 'em_atraso' && adesaoId && comprovantePendente(adesaoId, b.id)) p.status = 'em_analise';
    // o que o banco cobra: valor devido + taxa do contrato
    p.totalBoleto = arredonda(p.valorDevido + p.taxaBoleto);
    return p;
  }

  function resumoFinanceiro(adesao, todos) {
    const projetados = todos.filter((b) => !b.unico);
    const soma = (f) => arredonda(projetados.filter(f).reduce((a, b) => a + b.valorDevido, 0));
    const proxima = projetados
      .filter((b) => ['em_aberto', 'em_atraso', 'em_analise', 'agendado', 'nao_gerado'].includes(b.status))
      .filter((b) => b.vencimento >= HOJE)
      .sort((a, b) => a.vencimento.localeCompare(b.vencimento))[0];
    return {
      contratado: adesao.contrato.total,
      parcelas: adesao.contrato.parcelas,
      mensalidade: adesao.contrato.mensalidade,
      pago: soma((b) => b.status === 'pago'),
      emAberto: soma((b) => b.status === 'em_aberto'),
      emAtraso: soma((b) => b.status === 'em_atraso'),
      emAnalise: soma((b) => b.status === 'em_analise'),
      aEmitir: soma((b) => b.status === 'agendado' || b.status === 'nao_gerado'),
      parcelasPagas: projetados.filter((b) => b.status === 'pago' && !b.unico).length,
      proximoVencimento: proxima ? { vencimento: proxima.vencimento, valor: proxima.valorDevido, status: proxima.status } : null,
    };
  }

  function validarSegundaVia(b, novoVencimento) {
    if (b.unico) return erro(409, { erro: 'unico_sem_segunda_via' });
    if (situacaoBoleto(b) !== 'em_atraso') return erro(409, { erro: 'nao_esta_vencida', status: situacaoBoleto(b) });
    const hojeD = new Date(`${HOJE}T12:00:00`);
    const novaData = new Date(`${novoVencimento}T12:00:00`);
    if (Number.isNaN(novaData.getTime()) || novaData < hojeD) return erro(400, { erro: 'data_invalida' });
    if ((novaData - hojeD) / 86400000 > DIAS_SEGUNDA_VIA) return erro(400, { erro: 'data_longe' });
    return null;
  }
  const DIAS_SEGUNDA_VIA = 5;   // a 2ª via vence em 5 dias

  // --- boleto único de antecipação (igual ao servidor.mjs) ----------------------
  const DIAS_VENCIMENTO_UNICO = 3;
  let sequencialUnico = 0;

  async function montarUnico(adesao, billIds) {
    const ids = Array.isArray(billIds) ? [...new Set(billIds.map(String))] : [];
    if (!ids.length) throw erro(400, { erro: 'nenhuma_parcela' });
    const escolhidas = [];
    for (const id of ids) {
      const b = adesao.boletos.find((x) => x.id === id);
      if (!b || b.unico) throw erro(400, { erro: 'parcela_invalida' });
      const s = situacaoBoleto(b);
      if (s === 'pago' || unicoAtivoDa(b)) throw erro(400, { erro: 'parcela_indisponivel' });
      escolhidas.push({ b, s });
    }
    escolhidas.sort((x, y) => x.b.parcela - y.b.parcela);

    const venc = new Date(`${HOJE}T12:00:00`);
    venc.setDate(venc.getDate() + DIAS_VENCIMENTO_UNICO);
    const vencimento = venc.toISOString().slice(0, 10);

    const parcelas = [];
    for (const { b, s } of escolhidas) {
      if (s === 'em_atraso') {
        const e = calcularEncargos(b, venc);
        parcelas.push({ id: b.id, parcela: b.parcela, vencimento: b.vencimentoOriginal || b.vencimento, vencida: true, valorDaParcela: b.valor, valor: e.total, encargos: e });
      } else {
        parcelas.push({ id: b.id, parcela: b.parcela, vencimento: b.vencimento, vencida: false, valorDaParcela: b.valor, valor: b.valorAtualizado || b.valor, encargos: b.encargos || null });
      }
    }
    const total = arredonda(parcelas.reduce((a, p) => a + p.valor, 0));
    const primeira = parcelas[0].parcela;
    const ultima = parcelas[parcelas.length - 1].parcela;
    const turma = acharTurma(adesao.turmaId);
    const id = `unico-${adesao.adesaoId}-${sequencialUnico + 1}`;
    return {
      id, parcela: null,
      descricao: `${turma.eventoCrm} - BOLETO UNICO (parcela${parcelas.length > 1 ? `s ${primeira} a ${ultima}` : ` ${primeira}`})`,
      vencimento, valor: total, status: 'em_aberto', pagoEm: null, valorPago: null,
      linhaDigitavel: linhaFalsa(`${id}-${vencimento}`), pdfUrl: null, urlPagamento: null,
      unico: {
        parcelas,
        diasParaVencer: DIAS_VENCIMENTO_UNICO,
      },
    };
  }

  // --- regras do termo de adesão (iguais às do servidor.mjs) ------------------
  // Vêm do contrato (adesao-contrato.template.ts), com a cláusula citada.
  // A parcela tem VALOR FIXO (06/10/2026): não há desconto de pontualidade a
  // perder, e o IPCA do contrato é o reajuste programado dos 12 meses, que já
  // chega dentro do valor da parcela. O atraso acrescenta só o juro de mora.
  const REGRA_ENCARGOS = 'Valor da parcela acrescido de juros de mora de 1% ao mês, calculados pro rata die';
  const CONTRATO = {
    jurosMoraMes: 0.01,                    // 4.3
    diasNotificacaoAntesNegativar: 15,     // 8.2
    honorariosCobranca: 0.10,              // 8.3
    diasInadimplenciaRescisao: 90,         // 17.1
    taxaReprogramacao: 75,                 // 17.3
  };
  const TIPOS_SOLICITACAO = {
    convites_extras: 'Convites extras',
    antecipacao: 'Antecipação de parcelas',
    renegociacao: 'Negociação de débitos',
    contestacao: 'Contestação de cobrança',
    dados_contato: 'Correção de contato',
    comprovante: 'Comprovante de pagamento',
    lembrete: 'Lembrete de vencimento',
    presenca: 'Confirmação de presença',
    quitacao: 'Declaração de quitação',
    pagamento_duplicado: 'Pagamento em duplicidade',
    outro: 'Pedido para a equipe',
  };

  const arredonda = (n) => Math.round(n * 100) / 100;

  let sequencialProtocolo = 0;
  function novaSolicitacao(adesao, tipo, payload) {
    sequencialProtocolo += 1;
    const agora = new Date();
    const s = {
      id: `sol-${solicitacoes.length + 1}`,
      protocolo: `SOL-${agora.getFullYear()}-${String(sequencialProtocolo).padStart(4, "0")}`,
      adesaoId: adesao.adesaoId,
      tipo,
      rotulo: TIPOS_SOLICITACAO[tipo] || TIPOS_SOLICITACAO.outro,
      payload,
      status: 'aberta',
      criadoEm: agora.toISOString(),
    };
    solicitacoes.push(s);
    return s;
  }

  function calcularEncargos(boleto, ate) {
    const venceu = new Date(`${boleto.vencimentoOriginal || boleto.vencimento}T12:00:00`);
    const dias = Math.max(0, Math.round((ate - venceu) / 86400000));
    const valor = arredonda(boleto.valor);
    const juros = arredonda(valor * CONTRATO.jurosMoraMes * (dias / 30));
    return {
      diasAtraso: dias,
      valorParcela: valor,
      juros,
      total: arredonda(valor + juros),
      regra: REGRA_ENCARGOS,
    };
  }
  async function extratoDoFormando(adesao) {
    // o boleto único é outra forma de pagar as mesmas parcelas: não entra na conta
    const bs = await Promise.all(adesao.boletos.filter((b) => !b.unico).map(async (b) => ({ ...b, ...(await projetarComValor(b, adesao.adesaoId, adesao)) })));
    const pagas = bs.filter((b) => b.status === 'pago')
      .sort((a, b) => (a.pagoEm || a.vencimento).localeCompare(b.pagoEm || b.vencimento));
    const totalPago = arredonda(pagas.reduce((a, b) => a + (b.valorPago || b.valor), 0));
    const emAberto = arredonda(bs.filter((b) => b.status !== 'pago').reduce((a, b) => a + b.valorDevido, 0));
    return {
      contrato: {
        total: adesao.contrato.total, parcelas: adesao.contrato.parcelas,
        mensalidade: adesao.contrato.mensalidade,
        primeiraParcela: adesao.contrato.primeiraParcela, assinadoEm: adesao.contrato.assinadoEm,
      },
      reajustes: adesao.reajustesAplicados || [],
      reajusteProgramado: adesao.reajuste?.aplicado ? null : adesao.reajuste || null,
      pagamentos: pagas.map((b) => ({
        parcela: b.parcela, vencimento: b.vencimento, pagoEm: b.pagoEm,
        valor: b.valor, valorPago: b.valorPago || b.valor, forma: b.pagoPeloUnico ? 'Boleto único' : 'Boleto',
      })),
      totais: {
        pago: totalPago, emAberto,
        parcelasPagas: pagas.length, parcelasEmAberto: bs.length - pagas.length,
        quitado: emAberto === 0,
      },
      emitidoEm: new Date().toISOString(),
    };
  }
  const contestacaoAberta = (adesaoId, billId) => {
    const s = solicitacoes.find((x) => x.adesaoId === adesaoId && x.tipo === 'contestacao' && x.status === 'aberta' && x.payload?.billId === billId);
    return s ? { protocolo: s.protocolo, criadoEm: s.criadoEm, motivo: s.payload?.motivo || null } : null;
  };

  const comprovantesDoBoleto = (adesaoId, billId) => comprovantes
    .filter((c) => c.adesaoId === adesaoId && c.billId === billId)
    .map(({ conteudo, adesaoId: _a, ...resto }) => resto);

  // --- recibo de parcela paga ------------------------------------------------
  function reciboDaParcela(adesao, turma, b) {
    return {
      numero: `REC-${turma.codigo}-${String(b.parcela).padStart(3, '0')}`,
      formando: adesao.nome.replace(/\s*\(TESTE\)\s*/i, ''),
      cpf: adesao.cpf.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, '$1.$2.$3-$4'),
      turma: turma.rotulo,
      evento: turma.eventoCrm,
      parcela: b.parcela,
      totalParcelas: adesao.contrato.parcelas,
      descricao: b.descricao,
      vencimento: b.vencimento,
      pagoEm: b.pagoEm,
      valorPago: b.valorPago || b.valor,
      forma: 'Boleto bancário',
      emitidoEm: new Date().toISOString(),
    };
  }

  // --- informe anual de pagamentos (imposto de renda) ------------------------
  function informeAnual(adesao) {
    const pagas = adesao.boletos.map((b) => ({ ...b, status: situacaoBoleto(b) })).filter((b) => b.status === 'pago');
    const porAno = new Map();
    for (const b of pagas) {
      const ano = (b.pagoEm || b.vencimento).slice(0, 4);
      const atual = porAno.get(ano) || { ano, total: 0, parcelas: 0 };
      atual.total = arredonda(atual.total + (b.valorPago || b.valor));
      atual.parcelas += 1;
      porAno.set(ano, atual);
    }
    return {
      anos: [...porAno.values()].sort((a, b) => b.ano.localeCompare(a.ano)),
      prestador: DADOS.config.prestador || {
        razaoSocial: 'INDAIÁ EVENTOS (dados de exemplo)',
        cnpj: '00.000.000/0001-00',
      },
    };
  }

  // --- central de avisos (o sino) -------------------------------------------
  function notificacoes(adesao) {
    const turma = acharTurma(adesao.turmaId);
    const hojeD = new Date(`${HOJE}T12:00:00`);
    const emDias = (iso) => Math.round((new Date(`${iso}T12:00:00`) - hojeD) / 86400000);
    const itens = [];

    if (adesao.situacao !== 'cancelada') {
      const bs = adesao.boletos.map((b) => ({ ...b, status: situacaoBoleto(b) }));
      for (const b of bs.filter((b) => b.status === 'em_atraso')) {
        itens.push({
          id: `atraso-${b.id}`, tipo: 'atraso', prioridade: 1,
          titulo: `${nomeCobranca(b)} vencida`,
          texto: `Venceu em ${b.vencimento.split('-').reverse().join('/')} — gere a 2ª via com data nova.`,
          quando: b.vencimento, ir: 'financeiro', billId: b.id,
        });
      }
      for (const b of bs.filter((b) => b.status === 'expirado')) {
        const ps = b.unico.parcelas;
        itens.push({
          id: `expirou-${b.id}`, tipo: 'vencimento', prioridade: 2,
          titulo: 'Boleto único cancelado',
          texto: `Venceu em ${b.vencimento.split('-').reverse().join('/')} sem pagamento. ${ps.length > 1 ? `As parcelas ${ps[0].parcela} a ${ps[ps.length - 1].parcela} continuam` : `A parcela ${ps[0].parcela} continua`} como estava${ps.length > 1 ? 'm' : ''}.`,
          quando: b.vencimento, ir: 'financeiro',
        });
      }
      // "vence em N dias" só para o que já tem boleto na mão para pagar
      for (const b of bs.filter((b) => b.status === 'em_aberto')) {
        const d = emDias(b.vencimento);
        if (d >= 0 && d <= 10) {
          itens.push({
            id: `vence-${b.id}`, tipo: 'vencimento', prioridade: 2,
            titulo: `${nomeCobranca(b)} vence ${d === 0 ? 'hoje' : d === 1 ? 'amanhã' : `em ${d} dias`}`,
            texto: `${b.vencimento.split('-').reverse().join('/')} · R$ ${(b.valorAtualizado || b.valor).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`,
            quando: b.vencimento, ir: 'financeiro', billId: b.id,
          });
        }
      }
    }

    for (const s of solicitacoes.filter((s) => s.adesaoId === adesao.adesaoId)) {
      if (s.status !== 'aberta') {
        itens.push({
          id: `pedido-${s.id}`, tipo: 'pedido', prioridade: 2,
          titulo: `${s.rotulo}: ${s.status === 'atendida' ? 'resolvido' : 'não aprovado'}`,
          texto: s.protocolo, quando: s.criadoEm.slice(0, 10), ir: 'pedidos',
        });
      }
    }

    // O mural da turma não entra aqui: o sino é do que depende do formando.
    const proxima = turma.cronograma.filter((e) => e.data >= HOJE).sort((a, b) => a.data.localeCompare(b.data))[0];
    if (proxima && emDias(proxima.data) <= 45) {
      itens.push({
        id: `etapa-${chaveEtapa(proxima)}`, tipo: 'etapa', prioridade: 3,
        titulo: `Chegando: ${proxima.etapa}`,
        texto: `${proxima.data.split('-').reverse().join('/')}${proxima.local ? ` · ${proxima.local}` : ''}`,
        quando: proxima.data, ir: 'cronograma',
      });
    }

    const vistas = lidas.get(adesao.adesaoId) || new Set();
    const lista = itens
      .map((i) => ({ ...i, lida: vistas.has(i.id) }))
      .sort((a, b) => (a.prioridade - b.prioridade) || b.quando.localeCompare(a.quando));
    return { itens: lista, naoLidas: lista.filter((i) => !i.lida).length };
  }

  function daSessao(token, { permitirEscolha = false } = {}) {
    const s = sessoes.get(token);
    if (!s || (s.etapa && !permitirEscolha)) throw erro(401, { erro: 'sessao_invalida' });
    if (s.etapa && permitirEscolha) return s;
    const adesao = acharAdesao(s.adesaoId);
    if (!adesao) throw erro(401, { erro: 'sessao_invalida' });
    return adesao;
  }

  const ROTAS = {
    'GET /config': () => ({
      whatsappAtendimento: DADOS.config.whatsappAtendimento,
      nomeAtendimento: DADOS.config.nomeAtendimento,
      mostrarReajusteProgramado: DADOS.config.mostrarReajusteProgramado,
      modoDev: true,
      demo: true,
      cpfExemplo: (DADOS.adesoes.find((x) => x.adesaoId === 'ades-7506-teste') || DADOS.adesoes[0]).cpf,
      contrato: CONTRATO,
      avisoDados: DADOS.aviso,
      hojeSimulado: HOJE,
    }),

    'POST /auth/otp/solicitar': (_t, corpo) => {
      const doc = soDigitos(corpo.cpf);
      if (doc.length !== 11) throw erro(400, { erro: 'cpf_invalido' });

      const dia = new Date().toISOString().slice(0, 10);
      const contador = pedidosDoDia.get(doc);
      const atual = contador && contador.dia === dia ? contador : { dia, quantidade: 0 };
      if (atual.quantidade >= OTP.tetoDiario) throw erro(429, { erro: 'muitas_tentativas' });

      const anterior = codigos.get(doc);
      if (anterior && Date.now() - anterior.criadoEm < OTP.janelaMs) {
        throw erro(429, { erro: 'aguarde', segundos: Math.ceil((OTP.janelaMs - (Date.now() - anterior.criadoEm)) / 1000) });
      }

      const neutra = { enviado: true, canais: ['whatsapp', 'email'], destinos: {}, expiraEmSegundos: OTP.expiraMs / 1000 };
      const encontradas = adesoesPorCpf(doc);
      // Em produção a resposta é neutra; aqui, como nada é enviado, avisamos.
      if (!encontradas.length) return { ...neutra, cadastrado: false };

      const codigo = String(Math.floor(Math.random() * 1000000)).padStart(6, '0');
      codigos.set(doc, { codigo, expiraEm: Date.now() + OTP.expiraMs, tentativas: 0, criadoEm: Date.now() });
      pedidosDoDia.set(doc, { dia, quantidade: atual.quantidade + 1 });

      const alvo = encontradas[0];
      return {
        ...neutra,
        destinos: { email: mascararEmail(alvo.email), whatsapp: mascararTelefone(alvo.telefone) },
        codigoDev: codigo,
      };
    },

    'POST /auth/otp/verificar': (_t, corpo) => {
      const doc = soDigitos(corpo.cpf);
      const guardado = codigos.get(doc);
      if (!guardado || guardado.expiraEm < Date.now()) throw erro(401, { erro: 'codigo_invalido' });
      if (guardado.tentativas >= OTP.tentativas) throw erro(429, { erro: 'muitas_tentativas' });
      guardado.tentativas += 1;
      if (String(corpo.codigo || '') !== guardado.codigo) throw erro(401, { erro: 'codigo_invalido' });
      codigos.delete(doc);

      const encontradas = adesoesPorCpf(doc);
      if (encontradas.length > 1) {
        const token = novoToken();
        sessoes.set(token, { etapa: 'escolha', cpf: doc });
        return {
          precisaEscolherTurma: true,
          tokenEscolha: token,
          turmas: encontradas.map((a) => {
            const t = acharTurma(a.turmaId);
            return { adesaoId: a.adesaoId, turma: t.rotulo, curso: a.curso, dataEvento: t.dataEvento, cidade: t.cidade };
          }),
        };
      }

      const token = novoToken();
      sessoes.set(token, { adesaoId: encontradas[0].adesaoId });
      return { token, expiraEm: new Date(Date.now() + 30 * 60000).toISOString() };
    },

    'POST /auth/escolher-turma': (t, corpo) => {
      const s = daSessao(t, { permitirEscolha: true });
      if (!s.etapa) throw erro(401, { erro: 'sessao_invalida' });
      const adesao = acharAdesao(corpo.adesaoId);
      if (!adesao || adesao.cpf !== s.cpf) throw erro(404, { erro: 'nao_encontrado' });
      const token = novoToken();
      sessoes.set(token, { adesaoId: adesao.adesaoId });
      return { token, expiraEm: new Date(Date.now() + 30 * 60000).toISOString() };
    },

    // meus dados: o formando confere e pede correção; quem confirma é a equipe
    'GET /perfil': (t) => {
      const a2 = daSessao(t);
      const turma = acharTurma(a2.turmaId);
      return {
        nome: a2.nome,
        cpf: a2.cpf.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, '$1.$2.$3-$4'),
        email: a2.email,
        telefone: a2.telefone,
        curso: a2.curso,
        turma: turma.rotulo,
        pendente: contatoPendente.get(a2.adesaoId) || null,
        lembreteDias: lembretes.get(a2.adesaoId) ?? null,
        endereco: enderecoDoPerfil(a2.adesaoId),
      };
    },

    // Endereço: a operadora não mostra o boleto de quem não tem endereço no
    // cadastro. Na demonstração ele começa VAZIO de propósito — é o estado dos
    // formandos que assinaram antes de o link exigir os campos separados, e é
    // esse caminho que a gente quer poder mostrar.
    'PATCH /perfil/endereco': (t, corpo) => {
      const a = daSessao(t);
      const cep = soDigitos(corpo.cep);
      if (cep.length !== 8) throw erro(400, { erro: 'cep_invalido', message: 'O CEP precisa ter 8 números.' });
      const uf = String(corpo.uf || '').trim().toUpperCase();
      if (uf.length !== 2) throw erro(400, { erro: 'uf_invalida', message: 'O estado precisa ter 2 letras (ex.: SC).' });
      const rua = String(corpo.endereco || corpo.rua || '').trim();
      const numero = String(corpo.numero || '').trim();
      const cidade = String(corpo.cidade || '').trim();
      if (!rua) throw erro(400, { erro: 'rua', message: 'Diga o nome da rua.' });
      if (!numero) throw erro(400, { erro: 'numero', message: 'Diga o número. Se não tiver, escreva "s/n".' });
      if (!cidade) throw erro(400, { erro: 'cidade', message: 'Diga a cidade.' });
      enderecos.set(a.adesaoId, {
        rua, numero, complemento: String(corpo.complemento || '').trim(),
        bairro: String(corpo.bairro || '').trim(), cidade, uf, cep,
      });
      return { endereco: enderecoDoPerfil(a.adesaoId), vindi: { atualizado: true, erro: null } };
    },

    // lembrete de vencimento: quantos dias antes avisar (null desliga)
    'POST /perfil/lembrete': (t, corpo) => {
      const a = daSessao(t);
      if (corpo.dias === null || corpo.dias === 0) {
        lembretes.delete(a.adesaoId);
        return { lembreteDias: null };
      }
      const n = Number(corpo.dias);
      if (![1, 3, 5, 7].includes(n)) throw erro(400, { erro: 'prazo_invalido' });
      lembretes.set(a.adesaoId, n);
      const s = novaSolicitacao(a, 'lembrete', { mensagem: `Avisar por e-mail ${n} dia(s) antes de cada vencimento.`, quantidade: n });
      return { lembreteDias: n, protocolo: s.protocolo };
    },

    'POST /perfil/contato': (t, corpo) => {
      const a2 = daSessao(t);
      const novoEmail = String(corpo.email || '').trim();
      const novoTelefone = soDigitos(corpo.telefone);
      if (novoEmail && !/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(novoEmail)) throw erro(400, { erro: 'email_invalido' });
      if (novoTelefone && (novoTelefone.length < 10 || novoTelefone.length > 13)) throw erro(400, { erro: 'telefone_invalido' });
      const mudouEmail = novoEmail && novoEmail !== a2.email;
      const mudouTelefone = novoTelefone && novoTelefone !== soDigitos(a2.telefone);
      if (!mudouEmail && !mudouTelefone) throw erro(400, { erro: 'nada_mudou' });
      const pendente = {
        email: mudouEmail ? novoEmail : null,
        telefone: mudouTelefone ? novoTelefone : null,
        pedidoEm: new Date().toISOString(),
      };
      contatoPendente.set(a2.adesaoId, pendente);
      const pedido = novaSolicitacao(a2, 'dados_contato', {
        mensagem: [
          mudouEmail ? `e-mail: ${a2.email} → ${novoEmail}` : '',
          mudouTelefone ? `telefone: ${a2.telefone} → ${novoTelefone}` : '',
        ].filter(Boolean).join(' · '),
      });
      pendente.protocolo = pedido.protocolo;
      return { pendente, protocolo: pedido.protocolo };
    },

    'GET /me': (t) => {
      const a = daSessao(t);
      const turma = acharTurma(a.turmaId);
      return {
        nome: a.nome, primeiroNome: a.nome.split(' ')[0], curso: a.curso,
        situacao: a.situacao, canceladaEm: a.canceladaEm,
        turma: { codigo: turma.codigo, rotulo: turma.rotulo, dataEvento: turma.dataEvento, cidade: turma.cidade },
      };
    },

    'GET /financeiro': (t) => {
      const a = daSessao(t);
      if (a.situacao === 'cancelada') throw erro(409, { erro: 'adesao_cancelada', canceladaEm: a.canceladaEm });
      return Promise.all(a.boletos.map((b) => projetarComValor(b, a.adesaoId, a))).then((boletos) => {
        for (const p of boletos) {
          p.qtdComprovantes = comprovantes.filter((c) => c.adesaoId === a.adesaoId && c.billId === p.id).length;
          p.contestacao = contestacaoAberta(a.adesaoId, p.id);
        }
        return { resumo: resumoFinanceiro(a, boletos), boletos };
      });
    },

    // meus comprovantes: tudo o que o formando anexou
    'GET /comprovantes': (t) => {
      const a = daSessao(t);
      return {
        comprovantes: comprovantes
          .filter((c) => c.adesaoId === a.adesaoId)
          .sort((x, y) => y.enviadoEm.localeCompare(x.enviadoEm))
          .map(({ conteudo, adesaoId, ...resto }) => {
            const b = a.boletos.find((x) => x.id === resto.billId);
            return { ...resto, cobranca: b ? nomeCobranca(b) : '—', vencimento: b?.vencimento || null, temArquivo: Boolean(conteudo) };
          }),
      };
    },

    'GET /contrato': (t) => {
      const a = daSessao(t);
      const turma = acharTurma(a.turmaId);
      return {
        termo: {
          assinadoEm: a.contrato.assinadoEm,
          origem: a.contrato.docusealSubmissionId ? 'docuseal' : 'anexo',
          url: a.contrato.termoUrl,
        },
        contratoColetivo: { turma: turma.rotulo, url: a.contrato.contratoColetivoUrl },
        contratado: {
          total: a.contrato.total, parcelas: a.contrato.parcelas,
          mensalidade: a.contrato.mensalidade, primeiraParcela: a.contrato.primeiraParcela,
        },
        taxaBoleto: a.contrato.taxaBoleto ?? null,
        convites: a.convites,
        solicitacoes: solicitacoes.filter((s) => s.adesaoId === a.adesaoId),
      };
    },

    'POST /solicitacoes': (t, corpo) => {
      const a = daSessao(t);
      if (!TIPOS_SOLICITACAO[corpo.tipo]) throw erro(400, { erro: 'tipo_invalido' });
      if (corpo.tipo === 'contestacao' && corpo.billId && contestacaoAberta(a.adesaoId, corpo.billId)) {
        throw erro(409, { erro: 'contestacao_ja_aberta' });
      }
      return novaSolicitacao(a, corpo.tipo, {
        mensagem: String(corpo.mensagem || '').slice(0, 1000),
        quantidade: corpo.quantidade || null,
        conviteTipo: corpo.conviteTipo || null,
        billId: corpo.billId || null,
        motivo: corpo.motivo || null,
      });
    },

    'GET /solicitacoes': (t) => {
      const a = daSessao(t);
      return {
        solicitacoes: solicitacoes
          .filter((s) => s.adesaoId === a.adesaoId)
          .sort((x, y) => y.criadoEm.localeCompare(x.criadoEm)),
      };
    },

    'GET /extrato': (t) => extratoDoFormando(daSessao(t)),

    'GET /turma': (t) => {
      const a = daSessao(t);
      const turma = acharTurma(a.turmaId);
      const minhas = presencas.get(a.adesaoId) || {};
      // Quem está na turma: só o nome, como a API do CRM manda (07/10). A
      // contagem sai da lista para os dois nunca discordarem.
      const colegas = adesoes
        .filter((x) => x.turmaId === turma.id && x.situacao !== 'cancelada')
        .map((x) => ({ nome: String(x.nome ?? '').trim(), souEu: x.adesaoId === a.adesaoId }))
        .filter((c) => c.nome)
        .sort((x, y) => x.nome.localeCompare(y.nome, 'pt-BR'));
      return {
        codigo: turma.codigo, rotulo: turma.rotulo, curso: turma.curso, cursos: turma.cursos,
        dataEvento: turma.dataEvento, cidade: turma.cidade, espaco: turma.espaco,
        pacote: turma.pacote, formandos: colegas.length, consultora: turma.consultora,
        colegas,
        comissao: turma.comissao || [],
        fotos: turma.fotos,
        cronograma: turma.cronograma.map((e) => ({ ...e, chave: chaveEtapa(e), presenca: minhas[chaveEtapa(e)] || null })),
        avisos: turma.avisos,
      };
    },

    // confirmação de presença numa etapa do cronograma
    'POST /turma/presenca': (t, corpo) => {
      const a = daSessao(t);
      const turma = acharTurma(a.turmaId);
      const etapa = turma.cronograma.find((e) => chaveEtapa(e) === corpo.chave);
      if (!etapa) throw erro(404, { erro: 'etapa_nao_encontrada' });
      if (!['sim', 'nao'].includes(corpo.resposta)) throw erro(400, { erro: 'resposta_invalida' });
      const minhas = presencas.get(a.adesaoId) || {};
      minhas[corpo.chave] = corpo.resposta;
      presencas.set(a.adesaoId, minhas);
      const s = novaSolicitacao(a, 'presenca', {
        mensagem: `${etapa.etapa} (${etapa.data}): ${corpo.resposta === 'sim' ? 'vou' : 'não vou'}.`,
      });
      return { chave: corpo.chave, presenca: corpo.resposta, protocolo: s.protocolo };
    },

    'GET /notificacoes': (t) => notificacoes(daSessao(t)),

    'POST /notificacoes/lidas': (t, corpo) => {
      const a = daSessao(t);
      const vistas = lidas.get(a.adesaoId) || new Set();
      for (const id of Array.isArray(corpo.ids) ? corpo.ids : []) vistas.add(String(id));
      lidas.set(a.adesaoId, vistas);
      return { naoLidas: notificacoes(a).naoLidas };
    },

    'GET /informe-ir': (t) => informeAnual(daSessao(t)),
  };

  // Rotas com id no caminho.
  async function rotaComId(metodo, caminho, token, corpo) {
    const m1 = caminho.match(/^\/financeiro\/([\w-]+)$/);
    if (metodo === 'GET' && m1) {
      const a = daSessao(token);
      const b = a.boletos.find((x) => x.id === m1[1]);
      if (!b) throw erro(404, { erro: 'nao_encontrado' });   // boleto de outra pessoa: 404, nunca 403
      const status = situacaoBoleto(b);
      const escondido = status === 'agendado' || status === 'nao_gerado';
      return {
        ...(await projetarComValor(b, a.adesaoId, a)),
        contestacao: contestacaoAberta(a.adesaoId, b.id),
        linhaDigitavel: escondido ? null : b.linhaDigitavel,
        pdfUrl: escondido ? null : b.pdfUrl,
        urlPagamento: escondido ? null : b.urlPagamento,
        comprovantes: comprovantesDoBoleto(a.adesaoId, b.id),
        historico: historicoDoBoleto(a.adesaoId, b),
      };
    }

    // recibo da parcela paga (a página monta a prévia na tela)
    const mr = caminho.match(/^\/financeiro\/([\w-]+)\/recibo$/);
    if (metodo === 'GET' && mr) {
      const a = daSessao(token);
      const b = a.boletos.find((x) => x.id === mr[1]);
      if (!b) throw erro(404, { erro: 'nao_encontrado' });
      if (situacaoBoleto(b) !== 'pago') throw erro(409, { erro: 'parcela_nao_paga' });
      return reciboDaParcela(a, acharTurma(a.turmaId), b);
    }

    // informe de pagamentos de um ano
    const mi = caminho.match(/^\/informe-ir\/(\d{4})$/);
    if (metodo === 'GET' && mi) {
      const a = daSessao(token);
      const info = informeAnual(a);
      const doAno = info.anos.find((x) => x.ano === mi[1]);
      if (!doAno) throw erro(404, { erro: 'sem_pagamentos_no_ano' });
      const turma = acharTurma(a.turmaId);
      return {
        ...doAno,
        itens: a.boletos
          .map((b) => ({ ...b, status: situacaoBoleto(b) }))
          .filter((b) => b.status === 'pago' && (b.pagoEm || b.vencimento).startsWith(mi[1]))
          .sort((x, y) => (x.pagoEm || x.vencimento).localeCompare(y.pagoEm || y.vencimento))
          .map((b) => ({ parcela: b.parcela, vencimento: b.vencimento, pagoEm: b.pagoEm, valorPago: b.valorPago || b.valor })),
        prestador: info.prestador,
        formando: a.nome.replace(/\s*\(TESTE\)\s*/i, ''),
        cpf: a.cpf.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, '$1.$2.$3-$4'),
        turma: turma.rotulo,
      };
    }

    // prévia da 2ª via: a mesma conta do boleto, sem gerar nada
    const ms = caminho.match(/^\/financeiro\/([\w-]+)\/segunda-via\/simular$/);
    if (metodo === 'POST' && ms) {
      const a = daSessao(token);
      const b = a.boletos.find((x) => x.id === ms[1]);
      if (!b) throw erro(404, { erro: 'nao_encontrado' });
      const problema = validarSegundaVia(b, corpo.novoVencimento);
      if (problema) throw problema;
      return calcularEncargos(b, new Date(`${corpo.novoVencimento}T12:00:00`));
    }

    // 2ª via de parcela vencida, com encargos
    const mv = caminho.match(/^\/financeiro\/([\w-]+)\/segunda-via$/);
    if (metodo === 'POST' && mv) {
      const a = daSessao(token);
      const b = a.boletos.find((x) => x.id === mv[1]);
      if (!b) throw erro(404, { erro: 'nao_encontrado' });
      // Mesma trava do CRM: sem endereço a operadora cria a cobrança e não
      // mostra o boleto — e a antiga já foi cancelada no caminho. A tela
      // reconhece o código e pede o endereço na hora.
      const end = enderecoDoPerfil(a.adesaoId);
      if (!end.completo) {
        throw erro(409, {
          erro: 'endereco_incompleto',
          codigo: 'endereco_incompleto',
          falta: end.falta,
          message: `Para emitir o boleto, falta o seu endereço (${end.falta.join(', ')}). É rápido: informe e tente de novo.`,
        });
      }
      const problema = validarSegundaVia(b, corpo.novoVencimento);
      if (problema) throw problema;
      const novaData = new Date(`${corpo.novoVencimento}T12:00:00`);

      b.vencimentoOriginal = b.vencimentoOriginal || b.vencimento;
      const encargos = calcularEncargos(b, novaData);
      b.vencimento = corpo.novoVencimento;
      b.linhaDigitavel = linhaFalsa(`${b.id}-${corpo.novoVencimento}`);
      b.valorAtualizado = encargos.total;
      b.encargos = encargos;
      registrarHistorico(b.id, '2ª via gerada', `Novo vencimento ${corpo.novoVencimento.split('-').reverse().join('/')} · total ${encargos.total}`);
      return {
        ...projetarBoleto(b),
        linhaDigitavel: b.linhaDigitavel,
        pdfUrl: b.pdfUrl,
        urlPagamento: b.urlPagamento,
        encargos,
        comprovantes: comprovantesDoBoleto(a.adesaoId, b.id),
      };
    }

    // antecipação: /simular devolve a composição; sem sufixo, gera o boleto único
    const ma = caminho.match(/^\/financeiro\/antecipar(\/simular)?$/);
    if (metodo === 'POST' && ma) {
      const a = daSessao(token);
      const u = await montarUnico(a, corpo.billIds);
      if (ma[1]) {
        const taxa = taxaDoContrato(a);
        return { ...u, taxaBoleto: taxa, totalBoleto: arredonda(u.valor + taxa), economiaTaxa: arredonda(taxa * (u.unico.parcelas.length - 1)) };
      }
      sequencialUnico += 1;
      a.boletos.push(u);
      unicosPorId.set(u.id, u);
      for (const item of u.unico.parcelas) {
        const b = a.boletos.find((x) => x.id === item.id);
        b.noUnico = u.id;
        registrarHistorico(b.id, 'Incluída num boleto único', `Vence em ${u.vencimento.split('-').reverse().join('/')} · a parcela continua com o boleto dela`);
      }
      registrarHistorico(u.id, 'Boleto único gerado', `${u.unico.parcelas.length} parcela(s) · total ${u.valor}`);
      return { ...(await projetarComValor(u, a.adesaoId, a)), linhaDigitavel: u.linhaDigitavel };
    }

    // o arquivo do comprovante, para abrir na tela
    const mc = caminho.match(/^\/comprovantes\/([\w-]+)$/);
    if (metodo === 'GET' && mc) {
      const a = daSessao(token);
      const c = comprovantes.find((x) => x.id === mc[1] && x.adesaoId === a.adesaoId);
      if (!c) throw erro(404, { erro: 'nao_encontrado' });
      return { id: c.id, arquivo: c.arquivo, tipo: c.tipo, conteudo: c.conteudo };
    }

    // Os dados que o PDF mostraria. A página monta a prévia na tela.
    const m3 = caminho.match(/^\/financeiro\/([\w-]+)\/pdf$/);
    if (metodo === 'GET' && m3) {
      const a = daSessao(token);
      const b = a.boletos.find((x) => x.id === m3[1]);
      if (!b) throw erro(404, { erro: 'nao_encontrado' });
      const turma = acharTurma(a.turmaId);
      return {
        demo: true,
        formando: a.nome,
        cpf: a.cpf.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, '$1.$2.$3-$4'),
        turma: turma.rotulo,
        evento: turma.eventoCrm,
        parcela: b.parcela,
        unico: Boolean(b.unico),
        totalParcelas: a.contrato.parcelas,
        descricao: b.descricao,
        vencimento: b.vencimento,
        valor: b.valorAtualizado || b.valor,
        status: situacaoBoleto(b),
        pagoEm: b.pagoEm,
        linhaDigitavel: ['agendado', 'nao_gerado'].includes(situacaoBoleto(b)) ? null : b.linhaDigitavel,
      };
    }

    // Comprovante de pagamento. A parcela não muda de situação: quem dá baixa
    // é a equipe, depois de conferir.
    const m4 = caminho.match(/^\/financeiro\/([\w-]+)\/comprovante$/);
    if (metodo === 'POST' && m4) {
      const a = daSessao(token);
      const b = a.boletos.find((x) => x.id === m4[1]);
      if (!b) throw erro(404, { erro: 'nao_encontrado' });
      const TIPOS_OK = ['image/jpeg', 'image/png', 'image/webp', 'application/pdf'];
      if (!corpo.arquivo || !TIPOS_OK.includes(corpo.tipo)) throw erro(400, { erro: 'tipo_nao_aceito' });
      if (Number(corpo.tamanho) > 8 * 1024 * 1024) throw erro(400, { erro: 'arquivo_grande' });

      const registro = {
        id: `comp-${comprovantes.length + 1}`,
        adesaoId: a.adesaoId,
        billId: b.id,
        arquivo: String(corpo.arquivo).slice(0, 120),
        tipo: corpo.tipo,
        tamanho: Number(corpo.tamanho) || 0,
        observacao: String(corpo.observacao || '').slice(0, 500),
        status: 'em_analise',
        enviadoEm: new Date().toISOString(),
        conteudo: typeof corpo.conteudo === 'string' ? corpo.conteudo : null,
      };
      comprovantes.push(registro);
      const pedidoComp = novaSolicitacao(a, 'comprovante', {
        mensagem: `${nomeCobranca(b)} · ${registro.arquivo}`,
        billId: b.id,
      });
      registro.protocolo = pedidoComp.protocolo;
      const { conteudo, adesaoId, ...semArquivo } = registro;
      return semArquivo;
    }

    return undefined;
  }

  function linhaFalsa(semente) {
    let h = 0;
    for (const c of String(semente)) h = (h * 31 + c.charCodeAt(0)) % 1e9;
    const d = String(h).repeat(8);
    return `34191.${d.slice(0, 5)} ${d.slice(5, 10)}.${d.slice(10, 16)} ${d.slice(16, 21)}.${d.slice(21, 27)} 9 ${d.slice(27, 37)}`;
  }

  // Ponto de entrada usado pelo app no lugar do fetch.
  // Assíncrona porque a 2ª via calcula o juro até a data escolhida. As rotas diretas
  // continuam síncronas — o await aqui atende as duas formas.
  window.API_DEMO = async function (metodo, caminho, corpo, token) {
    const direta = ROTAS[`${metodo} ${caminho}`];
    const resposta = direta
      ? direta(token, corpo || {})
      : await rotaComId(metodo, caminho, token, corpo || {});
    if (resposta === undefined) throw erro(404, { erro: 'rota_nao_encontrada' });
    return resposta;
  };
})();

// ---------------------------------------------------------------------------
// LIGAÇÃO COM A API REAL DO CRM — /api/area-formando/* (25/09/2026)
//
// O portal nasceu sobre dados de exemplo e fala o dialeto do protótipo
// (`/auth/otp/solicitar`, resposta crua). O CRM responde no padrão dele
// (`/auth/codigo`, envelope `{ success, data }`). A tradução vive AQUI, num
// arquivo só, para o resto do app não saber de qual lado veio o dado — e para
// sumir sem deixar rastro quando o protótipo deixar de existir.
//
// LIGA/DESLIGA: `window.API_URL`. Sem ela, nada muda — o portal segue na
// demonstração. Com ela, passa a ler dados reais.
//
// O QUE A API AINDA NÃO TEM (e por isso a tela mostra menos): boleto único,
// 2ª via e os encargos de atraso. Cada um entra no CRM com a sua trava; até lá
// o adaptador devolve vazio em vez de inventar.
// ---------------------------------------------------------------------------

(function () {
  const BASE = window.API_URL;
  if (!BASE) return;

  const url = (caminho) => `${String(BASE).replace(/\/$/, '')}${caminho}`;

  /**
   * O TOKEN DO LINK DA EQUIPE (19/10/2026).
   *
   * A compra de convite fecha 7 dias antes da festa. Quando a equipe libera
   * alguém depois disso, manda um link com `?convite=…`; enquanto ele vale, a
   * compra daquela festa abre de novo para quem o recebeu.
   *
   * Guardado em `sessionStorage` porque o portal é uma página só e o endereço é
   * limpo logo depois: o token não fica na barra para ser copiado por cima do
   * ombro, nem vai parar no histórico compartilhado do computador da casa. Some
   * quando a aba fecha, que é a vida útil de uma compra.
   */
  const CHAVE_LIBERACAO = 'area-formando:liberacao';

  function guardarLiberacaoDaUrl() {
    try {
      const naUrl = new URLSearchParams(location.search).get('convite');
      if (!naUrl) return;
      sessionStorage.setItem(CHAVE_LIBERACAO, naUrl);
      // Tira o token da barra sem recarregar nem perder o resto do endereço.
      const limpo = new URL(location.href);
      limpo.searchParams.delete('convite');
      history.replaceState(null, '', limpo.pathname + limpo.search + limpo.hash);
    } catch { /* sem sessionStorage (aba anônima travada), segue sem liberação */ }
  }

  function liberacao() {
    try { return sessionStorage.getItem(CHAVE_LIBERACAO) || null; } catch { return null; }
  }

  guardarLiberacaoDaUrl();

  /** O CRM responde { success, data } — o app espera o conteúdo direto. */
  async function pedir(metodo, caminho, corpo, token) {
    const r = await fetch(url(caminho), {
      method: metodo,
      headers: {
        'content-type': 'application/json',
        ...(token ? { authorization: `Bearer ${token}` } : {}),
      },
      ...(corpo ? { body: JSON.stringify(corpo) } : {}),
    });
    const envelope = await r.json().catch(() => ({}));
    if (!r.ok) {
      const erro = new Error(envelope.message || 'falha');
      erro.status = r.status;
      // O CRM já responde em português e explicando ("a 2ª via vence em até 5
      // dias"). Guardar a frase deixa a tela mostrar ISSO em vez de um "não foi
      // possível" genérico — o protótipo devolvia códigos, e o app traduzia.
      if (envelope.message) erro.detalhe = envelope.message;
      // Alguns erros não são "deu errado", são "falta um dado seu": o CRM manda
      // um código em `data` e a tela reage a ele (pedir o endereço, por
      // exemplo) em vez de só mostrar a frase. O código não muda quando alguém
      // melhora o texto — por isso não dá para decidir pela mensagem.
      if (envelope.data && envelope.data.codigo) {
        erro.codigo = envelope.data.codigo;
        erro.falta = envelope.data.falta || [];
      }
      throw erro;
    }
    return envelope.data ?? {};
  }

  /**
   * Envio de arquivo. O portal lê o comprovante como data URL (era o que o
   * protótipo guardava); o CRM quer `multipart`, como todo upload dele. A
   * conversão mora aqui — o app continua sem saber do outro lado.
   */
  async function enviarArquivo(caminho, corpo, token) {
    const blob = await (await fetch(corpo.conteudo)).blob();
    const forma = new FormData();
    forma.append('comprovante', blob, corpo.arquivo || 'comprovante');
    // O que o formando escreveu junto ("paguei no caixa"): fica guardado com o
    // arquivo, porque é o contexto que o atendimento lê depois.
    if (corpo.observacao) forma.append('observacao', corpo.observacao);
    // Sem `content-type` de propósito: quem monta o limite do multipart é o
    // navegador, e escrever o cabeçalho na mão quebra o parse no servidor.
    const r = await fetch(url(caminho), {
      method: 'POST',
      headers: { ...(token ? { authorization: `Bearer ${token}` } : {}) },
      body: forma,
    });
    const envelope = await r.json().catch(() => ({}));
    if (!r.ok) {
      const erro = new Error(envelope.message || 'falha');
      erro.status = r.status;
      throw erro;
    }
    return envelope.data ?? {};
  }

  /** Destinos vêm mascarados numa lista; a tela mostra por canal. */
  function porCanal(destinos) {
    const lista = Array.isArray(destinos) ? destinos : [];
    return {
      whatsapp: lista.find((d) => !String(d).includes('@')) || null,
      email: lista.find((d) => String(d).includes('@')) || null,
    };
  }

  const dataBR = (iso) => (iso ? String(iso).slice(0, 10) : null);

  /**
   * Os convites que ele tem, tirados da lista do que está à venda.
   *
   * SÓ PARA A JANELA DE DEPLOY: desde 19/10/2026 a API manda `meusConvites`
   * pronto, e é ele que vale. Enquanto a versão em produção não tiver o campo,
   * isto devolve o que dá — o que está à venda e ele já possui. Em turma sem
   * evento cadastrado vem vazio, que é justamente o defeito corrigido; some
   * esta função quando a API nova estiver no ar há tempo.
   */
  const meusConvitesDasFestas = (festas) =>
    (festas || []).filter((f) => (f.inclusos || 0) > 0 || (f.jaComprados || 0) > 0);

  /**
   * O comprovante no CRM não tem status: a equipe só consulta, não aprova
   * (decisão de 25/09). Para o FORMANDO, porém, um comprovante anexado está
   * esperando a baixa — que é o que a tela dele chama de "em análise". Traduzir
   * aqui evita espalhar `status || 'em_analise'` por toda a interface.
   */
  const comoOPortalLe = (c) => ({ ...c, status: 'em_analise', analisadoEm: null });

  // ── avisos do sino ─────────────────────────────────────────────────────────
  // NÃO há tabela de notificação: o aviso é derivado do estado atual. Parcela
  // paga some da lista sozinha, pedido respondido idem — e nada fica para trás
  // esperando alguém marcar como resolvido.
  //
  // O "já li" fica no NAVEGADOR (localStorage), não no servidor. É preferência
  // de leitura, não dado do contrato: guardar no banco pediria tabela e rota
  // para algo que só serve a quem está olhando a tela. O preço é que, em outro
  // aparelho, o aviso volta a aparecer como novo.
  const CHAVE_LIDOS = 'area-formando:avisos-lidos';

  function lidos() {
    try { return new Set(JSON.parse(localStorage.getItem(CHAVE_LIDOS) || '[]')); }
    catch { return new Set(); }
  }

  function marcarLidos(ids) {
    try {
      const todos = lidos();
      for (const id of ids) todos.add(String(id));
      // Teto para a lista não crescer para sempre num aparelho só.
      localStorage.setItem(CHAVE_LIDOS, JSON.stringify([...todos].slice(-200)));
    } catch { /* navegador sem storage: os avisos só não ficam marcados */ }
  }

  const diasAteData = (iso) => {
    if (!iso) return null;
    const hoje = new Date();
    hoje.setHours(12, 0, 0, 0);
    return Math.round((new Date(`${iso}T12:00:00`) - hoje) / 86400000);
  };

  const dinheiro = (v) => `R$ ${Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;

  /** Quantos dias antes do vencimento o portal começa a lembrar. */
  const AVISAR_ANTES = 7;

  async function montarAvisos(token) {
    const [fin, ped] = await Promise.all([
      pedir('GET', '/financeiro', null, token).catch(() => ({ boletos: [] })),
      pedir('GET', '/solicitacoes', null, token).catch(() => ({ solicitacoes: [] })),
    ]);

    const itens = [];

    for (const b of fin.boletos || []) {
      if (b.unico) continue;
      const dias = diasAteData(b.vencimento);
      if (b.status === 'em_atraso') {
        itens.push({
          // O id carrega a situação: quando a parcela muda de estado, o aviso
          // vira outro e volta a aparecer como novo — que é o certo.
          id: `atraso:${b.id}`,
          tipo: 'atraso',
          titulo: `Parcela ${b.parcela ?? ''} vencida`.trim(),
          texto: `${dinheiro(b.totalBoleto)} · venceu há ${Math.abs(dias ?? 0)} dia${Math.abs(dias ?? 0) === 1 ? '' : 's'}. Já pagou? Anexe o comprovante.`,
          ir: 'financeiro',
          billId: b.id,
        });
      } else if (b.status === 'em_aberto' && dias !== null && dias >= 0 && dias <= AVISAR_ANTES) {
        itens.push({
          id: `vence:${b.id}:${b.vencimento}`,
          tipo: 'vencimento',
          titulo: dias === 0 ? `Parcela ${b.parcela ?? ''} vence hoje`.trim() : `Parcela ${b.parcela ?? ''} vence em ${dias} dia${dias === 1 ? '' : 's'}`.trim(),
          texto: `${dinheiro(b.totalBoleto)} · o boleto já está disponível.`,
          ir: 'financeiro',
          billId: b.id,
        });
      }
    }

    for (const s of ped.solicitacoes || []) {
      // Só o que MUDOU desde que ele pediu: pedido ainda pendente não é aviso,
      // é o estado normal de quem acabou de pedir.
      if (ABERTOS.includes(s.status)) continue;
      const comoFicou = { concluida: 'foi resolvido', recusada: 'foi recusado', cancelada: 'foi cancelado' }[s.status];
      if (!comoFicou) continue;
      itens.push({
        id: `pedido:${s.id}:${s.status}`,
        tipo: 'pedido',
        titulo: `${s.rotulo || 'Seu pedido'} ${comoFicou}`,
        texto: s.observacao ? `${s.protocolo} · ${s.observacao}` : `${s.protocolo} · abra para ver os detalhes.`,
        ir: 'pedidos',
      });
    }

    const jaLidos = lidos();
    const comLeitura = itens.map((n) => ({ ...n, lida: jaLidos.has(n.id) }));
    // Vencida antes de a vencer, e pedido respondido no topo do que sobra.
    const ordem = { atraso: 0, pedido: 1, vencimento: 2 };
    comLeitura.sort((a, b) => (ordem[a.tipo] ?? 9) - (ordem[b.tipo] ?? 9));

    return { itens: comLeitura, naoLidas: comLeitura.filter((n) => !n.lida).length };
  }

  /** Pedido que ainda dá trabalho para a equipe — os mesmos nomes do CRM. */
  const ABERTOS = ['pendente', 'em_atendimento'];

  /**
   * A composição do boleto único no vocabulário do protótipo.
   *
   * A tela lê `unico.parcelas` e `unico.diasParaVencer`; o CRM devolve a mesma
   * coisa em `itens` e a data pronta.
   */
  const comoOPortalLeOUnico = (r) => ({
    valor: r.subtotal,
    vencimento: r.vencimento,
    taxaBoleto: r.taxaBoleto,
    totalBoleto: r.total,
    economiaTaxa: r.economiaTaxa,
    unico: {
      diasParaVencer: 3,
      parcelas: (r.itens || []).map((i) => ({
        id: i.billId,
        parcela: i.parcela,
        vencimento: i.vencimento,
        vencida: i.vencida,
        valorDaParcela: i.valorDaParcela,
        valor: i.valor,
        encargos: i.encargos,
      })),
    },
  });

  /**
   * Uma cobrança, no vocabulário do portal.
   *
   * `valorDevido` é o que se paga SEM a taxa administrativa — o protótipo
   * separa as duas coisas para a tela poder dizer "inclui R$ 2,90 de taxa". Na
   * vencida esse valor já vem com o juro de mora, e é por isso que ele não pode
   * ser a parcela limpa: o boleto antigo ficou desatualizado, e pagar por ele
   * deixa a dívida de pé.
   */
  /**
   * Os encargos no formato que a tela conhece.
   *
   * Até a API nova subir, o CRM responde com os campos da regra antiga. Sem
   * esta tradução a composição do atraso mostraria a parcela como R$ 0,00.
   */
  const comoOsEncargosSaoHoje = (e) => (e ? { ...e, valorParcela: e.valorParcela ?? e.valorComPontualidade ?? 0 } : e);

  const doBoleto = (b) => ({
    ...b,
    encargosHoje: comoOsEncargosSaoHoje(b.encargosHoje),
    encargos: comoOsEncargosSaoHoje(b.encargos),
    valorDevido: Math.round(((b.totalBoleto || 0) - (b.taxaBoleto || 0)) * 100) / 100,
    // `url` é a fatura na operadora: é POR ELA que o formando paga (código de
    // barras e PDF — a casa não trabalha com Pix). Sem este mapeamento a tela
    // mostrava a parcela e não oferecia nenhuma forma de pagar.
    urlPagamento: b.url || null,
    // `unico`/`unicoAtivo` vêm da API desde 28/09 (mig 947): um diz que a
    // cobrança É o boleto único, o outro que a parcela está dentro de um.
    // `qtdComprovantes` vem da API desde 25/09 — é o que acende o selo
    // "Comprovante enviado" e o que faz a vencida virar "em análise".
    qtdComprovantes: b.qtdComprovantes || 0,
    contestacao: null,
  });

  /**
   * Tradução de uma chamada do protótipo para a API do CRM.
   * Devolve `undefined` quando a rota ainda não existe lá — quem chama decide
   * o que fazer (as telas dessas partes ficam escondidas).
   */
  async function traduzir(metodo, caminho, corpo, token) {
    // ── login ────────────────────────────────────────────────────────────────
    if (caminho === '/auth/otp/solicitar') {
      const r = await pedir('POST', '/auth/codigo', { cpf: corpo?.cpf }, null);
      // `codigoDev` só vem de ambiente que não é produção, onde nada é enviado —
      // é o que deixa testar o login sem mandar mensagem para o formando.
      if (r.enviado) return { cadastrado: true, destinos: porCanal(r.destinos), codigoDev: r.codigoDev };
      // Em produção a resposta é a mesma exista o CPF ou não: quem não tem
      // cadastro simplesmente não recebe código. Só o que a pessoa pode
      // corrigir volta como motivo.
      if (r.motivo === 'cpf_invalido') throw new Error('cpf_invalido');
      if (r.motivo === 'aguarde') throw new Error('aguarde');
      if (r.motivo === 'muitas_tentativas') throw new Error('muitas_tentativas');
      return { cadastrado: true, destinos: porCanal([]) };
    }

    if (caminho === '/auth/otp/verificar') {
      try {
        const r = await pedir('POST', '/auth/verificar', { cpf: corpo?.cpf, codigo: corpo?.codigo }, null);
        if (r.etapa === 'escolha') {
          return {
            precisaEscolherTurma: true,
            tokenEscolha: r.token,
            turmas: (r.adesoes || []).map((a) => ({
              adesaoId: a.adesaoId,
              turma: a.turma?.codigo || '',
              curso: a.turma?.curso || '',
              cidade: '',
              dataEvento: null,
            })),
          };
        }
        return { token: r.token };
      } catch (err) {
        // A tela sabe falar de código inválido; o resto vira falha genérica.
        throw new Error(err.status === 401 ? 'codigo_invalido' : 'falha');
      }
    }

    if (caminho === '/auth/escolher-turma') {
      const r = await pedir('POST', '/auth/escolher', { adesaoId: corpo?.adesaoId }, token);
      return { token: r.token };
    }

    // ── sessão ───────────────────────────────────────────────────────────────
    if (caminho === '/me') {
      const r = await pedir('GET', '/me', null, token);
      return {
        nome: r.nome,
        primeiroNome: r.primeiroNome,
        curso: r.curso,
        situacao: r.situacao,
        canceladaEm: null,
        turma: {
          codigo: r.turma?.codigo || '',
          rotulo: r.turma?.rotulo || r.turma?.codigo || '',
          instituicao: r.turma?.instituicao || null,
          dataEvento: dataBR(r.turma?.dataEvento),
          cidade: '',
        },
      };
    }

    if (caminho === '/financeiro') {
      // As contestações abertas entram junto: é o selo "Contestada" na lista.
      // Buscar só no detalhe deixava a lista sem o aviso, e o formando abria
      // uma parcela já contestada sem saber.
      const [r, pedidos] = await Promise.all([
        pedir('GET', '/financeiro', null, token),
        pedir('GET', '/solicitacoes', null, token).catch(() => ({ solicitacoes: [] })),
      ]);
      const contestadas = new Map(
        (pedidos.solicitacoes || [])
          .filter((s) => s.tipo === 'contestacao' && s.billId && ABERTOS.includes(s.status))
          .map((s) => [s.billId, { protocolo: s.protocolo, criadoEm: s.criadoEm, motivo: s.mensagem }]),
      );
      const boletos = (r.boletos || []).map((b) => ({ ...doBoleto(b), contestacao: contestadas.get(b.id) || null }));
      const resumo = r.resumo || {};
      return {
        resumo: {
          ...resumo,
          mensalidade: resumo.parcelas ? Math.round((resumo.contratado / resumo.parcelas) * 100) / 100 : 0,
          emAnalise: resumo.emAnalise || 0,
        },
        boletos,
      };
    }

    const umBoleto = caminho.match(/^\/financeiro\/([\w-]+)$/);
    if (umBoleto && metodo === 'GET') {
      // A tela do boleto mostra os comprovantes e a contestação DAQUELA parcela;
      // a API lista os do formando inteiro, então o filtro é aqui.
      const [b, todos, pedidos] = await Promise.all([
        pedir('GET', `/financeiro/${umBoleto[1]}`, null, token),
        pedir('GET', '/comprovantes', null, token).catch(() => ({ comprovantes: [] })),
        pedir('GET', '/solicitacoes', null, token).catch(() => ({ solicitacoes: [] })),
      ]);
      const contestacao = (pedidos.solicitacoes || []).find(
        (s) => s.tipo === 'contestacao' && s.billId === umBoleto[1] && ABERTOS.includes(s.status),
      );
      return {
        ...doBoleto(b),
        comprovantes: (todos.comprovantes || []).filter((c) => c.billId === umBoleto[1]).map(comoOPortalLe),
        historico: [],
        contestacao: contestacao
          ? { protocolo: contestacao.protocolo, criadoEm: contestacao.criadoEm, motivo: contestacao.mensagem }
          : null,
      };
    }

    // ── 2ª via ───────────────────────────────────────────────────────────────
    const simular2via = caminho.match(/^\/financeiro\/([\w-]+)\/segunda-via\/simular$/);
    if (simular2via && metodo === 'POST') {
      // A tela lê a composição direto (valorParcela, juros, total); no CRM ela
      // vem dentro de `encargos`, junto do total já com a taxa.
      const r = await pedir('POST', `/financeiro/${simular2via[1]}/segunda-via/simular`, corpo || {}, token);
      return comoOsEncargosSaoHoje(r.encargos) || {};
    }

    const emitir2via = caminho.match(/^\/financeiro\/([\w-]+)\/segunda-via$/);
    if (emitir2via && metodo === 'POST') {
      const r = await pedir('POST', `/financeiro/${emitir2via[1]}/segunda-via`, corpo || {}, token);
      // No protótipo a parcela mantém o id; aqui a 2ª via é uma cobrança NOVA,
      // e a antiga sai da lista. Quem chama precisa saber qual abrir depois.
      return { ...r, novoBillId: r.novoBillId || null };
    }

    // ── boleto único ─────────────────────────────────────────────────────────
    if (caminho === '/financeiro/antecipar/simular' && metodo === 'POST') {
      return comoOPortalLeOUnico(await pedir('POST', '/financeiro/antecipar/simular', corpo || {}, token));
    }
    if (caminho === '/financeiro/antecipar' && metodo === 'POST') {
      const r = await pedir('POST', '/financeiro/antecipar', corpo || {}, token);
      // A tela abre o boleto recém-criado pelo `id`.
      return { ...comoOPortalLeOUnico(r), id: r.billId, url: r.url };
    }

    // ── comprovante ──────────────────────────────────────────────────────────
    const anexar = caminho.match(/^\/financeiro\/([\w-]+)\/comprovante$/);
    if (anexar && metodo === 'POST') {
      return enviarArquivo(`/financeiro/${anexar[1]}/comprovante`, corpo || {}, token);
    }

    // ── o que ainda não existe no CRM ────────────────────────────────────────
    // Silêncio explícito: melhor a tela não mostrar a seção do que mostrar um
    // dado inventado. Quando a rota nascer, some daqui.
    //
    // ⚠️ Toda rota que o app chama no início PRECISA estar aqui, mesmo vazia: o
    // Início pede /financeiro e /turma juntos, e uma promessa rejeitada trava a
    // entrada inteira — foi o que aconteceu no primeiro teste.
    // A turma vem do CRM desde 29/09, com o cronograma que a equipe preencheu
    // na tela da turma. Antes era montada de /me e o cronograma vinha vazio, o
    // que deixava a aba inteira sem conteúdo.
    if (caminho === '/turma') {
      const t = await pedir('GET', '/turma', null, token);
      // Os campos que só o protótipo tem precisam existir, nem que vazios: a
      // tela faz `cursos.join(...)` sem perguntar, e um undefined aqui derrubava
      // a aba inteira antes de desenhar a primeira linha.
      return {
        ...t,
        dataEvento: dataBR(t.dataEvento),
        rotulo: t.rotulo || t.codigo || '',
        cronograma: t.cronograma || [],
        convites: t.convites || [],
        comissao: t.comissao || [],
        // Quem está na turma (07/10). A API manda só o nome de cada um.
        colegas: t.colegas || [],
        // A lista de cursos só existe quando a turma junta mais de um; repetir
        // aqui o rótulo (que JÁ é o curso) punha "Turma" e "Curso" com o mesmo
        // texto, um embaixo do outro.
        cursos: t.cursos || [],
        // sem cadastro no CRM: a tela esconde o que vier vazio em vez de
        // mostrar "undefined" para o formando
        espaco: t.espaco || '',
        cidade: t.cidade || '',
        consultora: t.consultora || '',
        pacote: t.pacote || '',
        avisos: t.avisos || [],
      };
    }
    // ── pedidos (viram demanda no CRM) ───────────────────────────────────────
    // Multas do contrato e a faixa de hoje, antes do pedido de cancelamento.
    if (caminho === '/cancelamento/condicoes') return pedir('GET', caminho, null, token);

    if (caminho === '/solicitacoes' && metodo === 'POST') {
      try {
        // O corpo do protótipo já é o que a API quer; o resto (motivo,
        // quantidade, tipo de convite) vai inteiro como memória do pedido.
        return await pedir('POST', '/solicitacoes', corpo || {}, token);
      } catch (err) {
        // 409 é a contestação já aberta — a tela sabe falar disso.
        // 409 da contestação tem tela própria; os outros (cancelamento já pedido)
        // chegam com a frase do CRM em `detalhe`.
        if (err.status === 409 && (corpo || {}).tipo === 'contestacao') throw new Error('contestacao_ja_aberta');
        throw err;
      }
    }
    if (caminho === '/solicitacoes') {
      const r = await pedir('GET', '/solicitacoes', null, token);
      return { solicitacoes: r.solicitacoes || [] };
    }

    // ── config ───────────────────────────────────────────────────────────────
    // Sem isto, `estado.config` ficava indefinido e três coisas quebravam sem
    // parecer relacionadas: "Falar com a gente" avisava que o WhatsApp não
    // estava configurado, o recibo tentava baixar um PDF inexistente, e os
    // prazos do contrato citados na tela caíam nos valores embutidos no JS.
    if (caminho === '/config') {
      const r = await pedir('GET', '/config', null, token);
      // O número pode vir nulo enquanto não estiver no ambiente do CRM: a tela
      // esconde o botão em vez de oferecer uma conversa que não abre.
      window.API_RECURSOS.falarComEquipe = Boolean(r.whatsappAtendimento);
      return r;
    }

    // ── contrato ─────────────────────────────────────────────────────────────
    // O CRM não tem rota de contrato para o formando. O que a tela precisa
    // (quanto, em quantas vezes, e o link do termo) sai de /me e /financeiro.
    // Sem isto a aba inteira morria em "não foi possível carregar".
    if (caminho === '/contrato') {
      // Os convites moram AQUI (pedido do Dani, 14/10): o que ele já tem, o
      // que falta assinar e o que já passou do prazo. A tela de comprar fala
      // só da compra que ele está fazendo agora.
      const [eu, fin, oferta, compras, nomes] = await Promise.all([
        pedir('GET', '/me', null, token),
        pedir('GET', '/financeiro', null, token),
        pedir('GET', '/convites', null, token).catch(() => null),
        pedir('GET', '/convites/historico', null, token).catch(() => []),
        pedir('GET', '/convites/nomes', null, token).catch(() => []),
      ]);
      const resumo = fin.resumo || {};
      const festas = (oferta && oferta.festas) || [];

      return {
        termo: { assinadoEm: null, origem: null, url: null },
        contratoColetivo: { turma: eu.turma?.rotulo || eu.turma?.codigo || '', url: null },
        contratado: {
          total: resumo.contratado || 0,
          parcelas: resumo.parcelas || 0,
          mensalidade: resumo.parcelas ? Math.round((resumo.contratado / resumo.parcelas) * 100) / 100 : 0,
          taxaBoleto: resumo.taxaBoleto || 0,
        },
        // Quantos convites ele tem em cada festa: os do pacote mais os extras
        // que comprou.
        //
        // VEM DE `meusConvites`, NÃO DE `festas` (19/10/2026): `festas` é o que
        // está à venda, e desde 16/10 só entra ali a festa com evento
        // cadastrado. Lendo dali, o formando de turma sem evento parava de ver
        // convites que já tinha pago. O `||` cobre a janela em que a API em
        // produção ainda não manda o campo novo.
        convites: (oferta?.meusConvites ?? meusConvitesDasFestas(festas))
          .map((f) => ({
            tipo: f.rotulo,
            quantidade: (f.inclusos || 0) + (f.jaComprados || 0),
            incluso: f.inclusos || 0,
            valorUnitario: f.unitario || 0,
            // Quantos já têm nome. A barra só aparece porque agora existe
            // onde cadastrar (mig 1080); antes vinha null de propósito.
            nomeados: ((nomes || []).find((n) => n.festa === f.chave) || {}).nomes?.length ?? 0,
          })),
        compras: Array.isArray(compras) ? compras : [],
        festasEncerradas: festas
          .filter((f) => f.unitario !== null && !f.podeComprar && f.motivo)
          .map((f) => ({ rotulo: f.rotulo, motivo: f.motivo })),
        clausulas: [],
      };
    }

    // ── convites extras ──────────────────────────────────────────────────────
    // Compra de convite depois da adesão (14/10/2026). O CRM é quem sabe preço,
    // lotação, prazo e forma de pagamento — o portal só desenha o que vier.
    // A liberação da equipe viaja em toda a conversa da compra: na oferta
    // ela diz quais festas reabrem; na simulação e na compra, é o que
    // autoriza passar do prazo.
    if (caminho === '/convites' && metodo === 'GET') {
      const lib = liberacao();
      return pedir('GET', lib ? ('/convites?liberacao=' + encodeURIComponent(lib)) : '/convites', null, token);
    }
    if (caminho === '/convites/historico' && metodo === 'GET') return pedir('GET', '/convites/historico', null, token);
    if (caminho === '/convites/simular' && metodo === 'POST') {
      return pedir('POST', '/convites/simular', { ...(corpo || {}), liberacao: liberacao() }, token);
    }
    if (caminho === '/convites/comprar' && metodo === 'POST') {
      return pedir('POST', '/convites/comprar', { ...(corpo || {}), liberacao: liberacao() }, token);
    }
    // Quem entra com cada convite. O prazo (15 dias antes da festa) é do CRM.
    // "o Pix já caiu?" — a tela pergunta enquanto o código está na frente dele.
    if (metodo === 'GET' && /^\/convites\/[\w-]+\/pix$/.test(caminho)) return pedir('GET', caminho, null, token);
    if (caminho === '/convites/nomes' && metodo === 'GET') return pedir('GET', '/convites/nomes', null, token);
    if (metodo === 'PUT' && /^\/convites\/nomes\/[\w-]+$/.test(caminho)) return pedir('PUT', caminho, corpo || {}, token);

    // ── meus dados ───────────────────────────────────────────────────────────
    // O CRM devolve tudo o que a tela precisa, inclusive `lembreteDias`: com
    // quanta antecedência ele é avisado do vencimento hoje (mig 1053). Quem
    // nunca escolheu recebe o padrão da casa, e o CRM já responde com ele.
    if (caminho === '/perfil') {
      return pedir('GET', '/perfil', null, token);
    }

    // A escolha de quando ser lembrado: 1, 3, 5 ou 7 dias antes, ou `null`,
    // que o CRM grava como "não quero".
    if (caminho === '/perfil/lembrete' && metodo === 'POST') {
      return pedir('POST', '/perfil/lembrete', corpo || {}, token);
    }

    if (caminho === '/perfil/contato' && (metodo === 'POST' || metodo === 'PATCH')) {
      return pedir('PATCH', '/perfil/contato', corpo || {}, token);
    }

    // O endereço é o que faz a operadora mostrar o boleto. Quem assinou antes de
    // o link exigir os campos separados informa aqui, e a resposta já diz se a
    // operadora foi atualizada.
    if (caminho === '/perfil/endereco' && (metodo === 'POST' || metodo === 'PATCH')) {
      return pedir('PATCH', '/perfil/endereco', corpo || {}, token);
    }

    // Informe de pagamentos do ano: a lista de anos. O PDF de cada ano não passa
    // por aqui — download vai direto, por `urlDoArquivo`.
    if (caminho === '/informe-ir') return pedir('GET', '/informe-ir', null, token);

    // ── extrato ──────────────────────────────────────────────────────────────
    // O CRM não tem rota de extrato: ele é um recorte do que /financeiro já
    // devolve. Montar aqui evita uma rota que só existiria para reempacotar
    // dado — e sem isto a tela "Extrato e comprovantes" morria em 501.
    if (caminho === '/extrato') {
      const r = await pedir('GET', '/financeiro', null, token);
      const resumo = r.resumo || {};
      const boletos = (r.boletos || []).filter((b) => !b.unico);
      const pagos = boletos.filter((b) => b.status === 'pago');
      return {
        emitidoEm: new Date().toISOString(),
        contrato: {
          total: resumo.contratado || 0,
          parcelas: resumo.parcelas || boletos.length,
          mensalidade: resumo.parcelas ? Math.round((resumo.contratado / resumo.parcelas) * 100) / 100 : 0,
          // O CRM guarda a data da assinatura na adesão, não no financeiro.
          assinadoEm: null,
        },
        totais: {
          parcelasPagas: resumo.parcelasPagas || pagos.length,
          pago: resumo.pago || 0,
          emAberto: Math.round(((resumo.emAberto || 0) + (resumo.emAtraso || 0) + (resumo.emAnalise || 0) + (resumo.aEmitir || 0)) * 100) / 100,
        },
        pagamentos: pagos.map((b) => ({
          parcela: b.parcela,
          vencimento: b.vencimento,
          pagoEm: b.pagoEm,
          valor: b.totalBoleto,
        })),
      };
    }

    // ── avisos (o sino) ──────────────────────────────────────────────────────
    // Decisão da equipe (29/09): o sino avisa duas coisas — fatura em aberto e
    // resposta a um pedido feito à equipe. Os dois saem do que a API já
    // devolve, então não há rota nova nem tabela: o aviso é DERIVADO do estado.
    // Parcela paga some sozinha da lista; pedido respondido idem.
    if (caminho === '/notificacoes') return montarAvisos(token);

    if (caminho === '/notificacoes/lidas' && metodo === 'POST') {
      marcarLidos(corpo?.ids || []);
      return montarAvisos(token);
    }
    if (caminho === '/comprovantes') {
      const r = await pedir('GET', '/comprovantes', null, token);
      return { comprovantes: (r.comprovantes || []).map(comoOPortalLe) };
    }
    if (caminho === '/solicitacoes') return { solicitacoes: [] };

    const naoImplementada = new Error('indisponivel_no_crm');
    naoImplementada.status = 501;
    throw naoImplementada;
  }

  /**
   * O que a API do CRM ainda NÃO faz. A tela esconde essas ações em vez de
   * oferecer um botão que dá erro — foi o que acontecia com "Gerar 2ª via",
   * que chamava uma rota inexistente e morria na cara do formando.
   *
   * Cada uma some daqui quando a rota nascer, e a tela volta sozinha.
   */
  window.API_RECURSOS = {
    // O CRM não tem rota de PDF do boleto: a cobrança real abre pelo link da
    // operadora, e a da turma de simulação não tem documento — só a linha.
    pdfDoBoleto: false,
    segundaVia: true,
    boletoUnico: true,
    encargos: true,
    editarContato: true,
    // O endereço o formando informa sozinho, e ele sobe para a operadora na
    // hora — é o que destrava o boleto de quem assinou sem endereço completo.
    editarEndereco: true,
    // Recibo da parcela paga em PDF (05/10/2026): o CRM gera com a data que a
    // operadora confirmou. Sai como comprovante, sem CNPJ, enquanto a equipe não
    // define qual empresa do grupo emite a cobrança da formatura.
    recibo: true,
    // A lista de formandos da turma em PDF (09/10/2026): os nomes da tela
    // separados por curso, com o telefone ao lado — este o CRM só põe no papel,
    // a tela continua sem contato de colega.
    listaDaTurmaPdf: true,
    // Ligado pela resposta de /config, que diz se há número de atendimento.
    falarComEquipe: false,
    // Informe de pagamentos do ano (05/10/2026). O CNPJ que faltava foi
    // decidido: o da CONTRATADA, a mesma empresa do contrato de adesão. A soma
    // é pelo regime de caixa, com o que a operadora confirmou.
    informeIr: true,
    // O sino avisa fatura em aberto e resposta a pedido (decisão de 29/09).
    notificacoes: true,
    // Lembrete de vencimento: o job já existe e a preferência de cada um tem
    // onde morar (mig 1053, aplicada em 09/10), mas a ROTA que grava a escolha
    // está só na dev. Ligar isto antes de ela chegar em produção põe no ar um
    // botão que morre em erro. Vira `true` no dia do deploy do dev→master.
    //
    // No protótipo e na demonstração a seção continua aparecendo: lá não existe
    // `API_RECURSOS`, e é assim que dá para testar a tela antes do deploy.
    lembrete: false,
    // Confirmar presença e convites nomeados: sem lugar no CRM para cadastrar.
    presenca: false,
    convites: false,
  };

  window.API_CRM = traduzir;
})();

</script>
<script>
// Área do Formando — front do protótipo local.
// Conversa só com os endpoints /area-formando/* descritos na Parte 4 do plano.
// Trocar pela API real depois = mudar API_BASE e de onde vem o token.

const API_BASE = '/area-formando';

/**
 * O endereço de um arquivo que vem da API (PDF, principalmente).
 *
 * Download não passa pelo adaptador do CRM: o navegador precisa ir direto, para
 * receber o binário. Com `window.API_URL` apontando para o CRM, o caminho
 * relativo `/area-formando/...` cairia no servidor do SITE — que não tem API
 * nenhuma —, e todo PDF falharia em silêncio.
 */
function urlDoArquivo(caminho) {
  const base = String(window.API_URL || '').replace(/\/+$/, '');
  return base ? base + caminho : API_BASE + caminho;
}
const app = document.getElementById('app');
const folha = document.getElementById('folha');
const toast = document.getElementById('aviso-flutuante');

const estado = {
  token: null,
  tokenEscolha: null,
  cpf: '',
  config: null,
  eu: null,
  financeiro: null,
  contrato: null,
  turma: null,
  avisos: null,
  aba: 'inicio',
  filtro: 'todas',
  visao: 'ano',
  menuAberto: false,
};

// ---------- utilidades -------------------------------------------------------
const guardar = (t) => { try { sessionStorage.setItem('formando_token', t); } catch { /* modo privado */ } };
const recuperar = () => { try { return sessionStorage.getItem('formando_token'); } catch { return null; } };
const esquecer = () => { try { sessionStorage.removeItem('formando_token'); } catch { /* ignora */ } };

const brl = (v) => (v ?? 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const dataCurta = (iso) => iso ? new Date(`${iso}T12:00:00`).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '—';
const dataLonga = (iso) => iso ? new Date(`${iso}T12:00:00`).toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' }) : '—';
/**
 * A DATA DE UM INSTANTE COMPLETO, no fuso de Brasília (22/10/2026).
 *
 * `dataCurta` espera `2026-10-29` e cola `T12:00:00` no fim — com um ISO
 * inteiro (`2026-10-31T02:59:59+00:00`) isso vira `...+00:00T12:00:00`, que
 * não é data nenhuma: a tela escrevia "Invalid Date" no prazo da compra.
 *
 * E o fuso importa aqui: esse instante é 30/10 às 23:59 em Brasília. Sem
 * converter, a tela prometeria um dia a mais do que o link dá.
 */
const dataDoInstante = (iso) => {
  if (!iso) return '—';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('pt-BR', {
    timeZone: 'America/Sao_Paulo',
    day: '2-digit',
    month: '2-digit',
    year: 'numeric',
  });
};

/** A hora de um instante completo (ISO), para "o código vale até 14:35". */
const horaCurta = (iso) => (iso ? new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '');
const mesAno = (iso) => iso ? new Date(`${iso}T12:00:00`).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }) : '—';
const escapar = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Tira o "(TESTE)" do nome do cadastro de teste na hora de mostrar na tela.
const semMarca = (n) => String(n || '').replace(/\s*\(TESTE\)\s*/i, '').trim();

const hoje = () => estado.config?.hojeSimulado || new Date().toISOString().slice(0, 10);
const diasAte = (iso) => Math.round((new Date(`${iso}T12:00:00`) - new Date(`${hoje()}T12:00:00`)) / 86400000);

// "agendado" e "nao_gerado" são diferentes na Vindi, mas para o formando são a
// mesma coisa: o boleto ainda não foi gerado.
const ROTULO_STATUS = {
  pago: 'Pago', em_aberto: 'Em aberto', em_atraso: 'Em atraso',
  agendado: 'Programada', nao_gerado: 'Programada',
  em_analise: 'Em análise', expirado: 'Expirado',
};

// Decisões da equipe (22/09/2026): a 2ª via vence em 5 dias; com mais de duas
// parcelas vencidas, a negociação vira um pedido para a equipe entrar em contato.
const DIAS_SEGUNDA_VIA = 5;
const MAX_VENCIDAS_SEM_EQUIPE = 2;

const nomeCobranca = (b) => b.nome || (b.unico ? 'Boleto único' : `Parcela ${b.parcela}`);
// O que aparece como "Referente a": o código do CRM (E08058 - PARC FORMATURA) não
// diz nada para o formando e fica só no PDF do boleto.
function descricaoAmigavel(b) {
  const turma = estado.eu?.turma?.codigo ? ` · turma ${estado.eu.turma.codigo}` : '';
  if (b.unico) return `Boleto único · ${rotuloParcelas(b.unico.parcelas)}${turma}`;
  const total = estado.financeiro?.resumo?.parcelas;
  return `Parcela ${b.parcela}${total ? ` de ${total}` : ''} da formatura${turma}`;
}

const rotuloParcelas = (ps) => (ps.length === 1 ? `parcela ${ps[0].parcela}` : `parcelas ${ps[0].parcela} a ${ps[ps.length - 1].parcela}`);
const maiuscula = (t) => t.charAt(0).toUpperCase() + t.slice(1);
// a linha de apoio de uma cobrança: "Parcela 6" ou, no boleto único, "Parcelas 6 a 8"
const apoioCobranca = (b) => (b.unico ? maiuscula(rotuloParcelas(b.unico.parcelas)) : nomeCobranca(b));
// o que se deve hoje: vencida já vem com os encargos, 2ª via com o valor novo
const arredondar = (n) => Math.round(n * 100) / 100;
const devido = (b) => b.valorDevido ?? b.valorAtualizado ?? b.valor;
// o que o banco cobra: o devido mais a taxa administrativa do contrato
const aPagar = (b) => b.totalBoleto ?? devido(b);

function avisar(texto) {
  toast.textContent = texto;
  toast.hidden = false;
  clearTimeout(avisar._t);
  avisar._t = setTimeout(() => { toast.hidden = true; }, 2600);
}

/**
 * A fonte de dados oferece esta ação?
 *
 * No protótipo tudo existe. Ligado ao CRM, algumas coisas ainda não foram
 * construídas (2ª via e boleto único escrevem cobrança na Vindi e entram uma a
 * uma) — e oferecer um botão que morre em erro é pior do que não oferecer.
 * `api-crm.js` declara o que falta em `window.API_RECURSOS`.
 */
function temRecurso(nome) {
  const r = window.API_RECURSOS;
  return !r || r[nome] !== false;
}

async function chamar(caminho, opcoes = {}) {
  // Com `window.API_URL` apontando para o CRM, o portal lê dados REAIS — a
  // tradução dos caminhos e formatos mora em api-crm.js.
  if (window.API_CRM) {
    const corpo = opcoes.body ? JSON.parse(opcoes.body) : null;
    return window.API_CRM(opcoes.method || 'GET', caminho, corpo, estado.token || estado.tokenEscolha);
  }
  // Na versão publicada não há servidor: a mesma API roda no navegador.
  if (window.API_DEMO) {
    const corpo = opcoes.body ? JSON.parse(opcoes.body) : null;
    return window.API_DEMO(opcoes.method || 'GET', caminho, corpo, estado.token || estado.tokenEscolha);
  }
  const resposta = await fetch(API_BASE + caminho, {
    ...opcoes,
    headers: {
      'content-type': 'application/json',
